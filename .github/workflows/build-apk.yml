name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install the Android SDK packages
        run: |
          set -eu
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          echo "SDK root: $SDK"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -1)"
          fi
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the APK
        run: gradle assembleRelease --no-daemon

      - name: Collect and name the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/Block3Logger-${{ github.run_number }}.apk"
          ls -la out

      - name: Publish it as a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${{ github.run_number }}" \
            out/*.apk \
            --title "Block 3 Logger - build ${{ github.run_number }}" \
            --notes "Tap the .apk file below on your phone to install it." \
            --latest

      - name: Also keep it as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: Block3Logger-apk
          path: out/*.apk
          if-no-files-found: error
